<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntários</title>
</head>
<body>
    <h1>Cadastro de Voluntários</h1>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados pessoais</legend>

            <div>
                <label for="nome_completo">Nome completo:</label>
                <input type="text" id="nome_completo" name="nome_completo" autocomplete="name" required>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div>
                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    autocomplete="tel"
                    placeholder="(00) 00000-0000"
                    pattern="\(\d{2}\)\s\d{4,5}-\d{4}"
                    title="Digite o telefone no formato (00) 00000-0000"
                    required>
            </div>

            <div>
                <label for="data_nascimento">Data de nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" autocomplete="bday" required>
            </div>

            <div>
                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    inputmode="numeric"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    title="Digite o CPF no formato 000.000.000-00"
                    required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <div>
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>
            </div>

            <div>
                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    inputmode="numeric"
                    autocomplete="postal-code"
                    placeholder="00000-000"
                    pattern="\d{5}-\d{3}"
                    title="Digite o CEP no formato 00000-000"
                    required>
            </div>

            <div>
                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero" min="1" required>
            </div>

            <div>
                <label for="complemento">Complemento:</label>
                <input type="text" id="complemento" name="complemento" autocomplete="address-line2">
            </div>

            <div>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" autocomplete="address-level2" required>
            </div>

            <div>
                <label for="estado">Estado:</label>
                <select id="estado" name="estado" autocomplete="address-level1" required>
                    <option value="">Selecione</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>
        </fieldset>

        <button type="submit">Cadastrar</button>
    </form>
</body>
